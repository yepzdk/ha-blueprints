blueprint:
  name: Spa heater mode control
  source_url: https://github.com/yepzdk/ha-blueprints/blob/main/spa_heater_mode.yaml
  description: >
    Controls a ControlMySpa-style heater mode select based on electricity price
    and an optional force-heating toggle. Bundles four concerns — all optional
    via toggles:
      1. Switch to READY when a cheap electricity hour starts; REST when it ends.
      2. Force READY while a force-heating input_boolean is on; re-evaluate when off.
      3. Watchdog: correct the select immediately if it ends up in READY_REST
         (cloud resets occasionally cause this on some spas).
      4. Periodic assertion: at a configurable cron-style interval, verify the
         mode matches the expected state and correct it if it drifted.
    Decision rule: READY when force_heating is on OR a cheap hour is active,
    otherwise REST.

    Hardcoded literals: this blueprint targets selects whose options are exactly
    "READY", "REST" and "READY_REST" (ControlMySpa convention). If your select
    uses different option names, fork the blueprint and rename them — they are
    not exposed as inputs.

    Notifications are optional and per-event opt-in (default off). The
    notify_service input takes a service id like notify.mobile_app_pixel_7 —
    not a friendly name. Message templates resolve {placeholder} tokens via
    Jinja replace(); literal "{" characters in custom messages will break
    substitution.
  domain: automation
  input:
    heater_mode_select:
      name: Heater mode select
      description: The spa's heater mode select entity (expected options include READY, REST, READY_REST).
      selector:
        entity:
          domain: select
    cheap_hour_sensor:
      name: Cheap electricity hour sensor
      description: Binary sensor that is "on" during cheap electricity hours.
      selector:
        entity:
          domain: binary_sensor
    force_heating_boolean:
      name: Force heating toggle
      description: input_boolean that forces READY mode regardless of price when on.
      selector:
        entity:
          domain: input_boolean
    online_sensor:
      name: Online sensor
      description: Binary sensor indicating the spa is reachable. Used to gate all actions.
      selector:
        entity:
          domain: binary_sensor
    enable_price_control:
      name: Enable price-based mode switching
      description: React to cheap_hour_sensor transitions.
      default: true
      selector:
        boolean:
    enable_force_override:
      name: Enable force-heating override
      description: React to the force_heating toggle transitions.
      default: true
      selector:
        boolean:
    enable_watchdog:
      name: Enable READY_REST watchdog
      description: Immediately correct the mode if it changes to READY_REST unexpectedly.
      default: true
      selector:
        boolean:
    enable_periodic_assert:
      name: Enable periodic assertion
      description: Periodically verify and correct the heater mode.
      default: true
      selector:
        boolean:
    assert_interval:
      name: Assertion interval (cron-style minutes)
      description: >
        Cron-style minutes pattern for the periodic assertion trigger.
        Use "/N" to run every N minutes (e.g. "/15", "/5"), or a comma list
        like "0,15,30,45" for specific minutes. A bare number such as "15"
        runs only once per hour at minute 15 — almost never what you want.
      default: "/15"
      selector:
        text:
    notify_service:
      name: Notification service
      description: >
        Notification service id to call (e.g. notify.mobile_app_pixel_7).
        This is the service id, not a friendly device name.
        Leave blank to disable all notifications from this blueprint.
      default: ""
      selector:
        text:
    notify_title:
      name: Notification title
      default: Spa
      selector:
        text:
    notify_on_watchdog:
      name: Notify on watchdog correction
      description: Send a notification when the watchdog corrects an unexpected READY_REST.
      default: false
      selector:
        boolean:
    notify_on_assert_correction:
      name: Notify on periodic correction
      description: Send a notification when periodic assertion corrects a drifted mode.
      default: false
      selector:
        boolean:
    watchdog_message:
      name: Watchdog notification message
      description: >
        Sent when READY_REST is corrected. Placeholders: {expected}.
      default: "Spa unexpectedly switched to READY_REST - corrected to {expected}"
      selector:
        text:
    assert_message:
      name: Assertion notification message
      description: >
        Sent when periodic assertion corrects a drifted mode.
        Placeholders: {current}, {expected}.
      default: "Spa mode corrected: {current} -> {expected}"
      selector:
        text:
variables:
  force_heating_boolean: !input force_heating_boolean
  cheap_hour_sensor: !input cheap_hour_sensor
  heater_mode_select: !input heater_mode_select
  notify_service: !input notify_service
  notify_title: !input notify_title
  notify_on_watchdog: !input notify_on_watchdog
  notify_on_assert_correction: !input notify_on_assert_correction
  watchdog_message: !input watchdog_message
  assert_message: !input assert_message
triggers:
  - trigger: state
    entity_id: !input cheap_hour_sensor
    to: "on"
    id: cheap_on
    enabled: !input enable_price_control
  - trigger: state
    entity_id: !input cheap_hour_sensor
    to: "off"
    id: cheap_off
    enabled: !input enable_price_control
  - trigger: state
    entity_id: !input force_heating_boolean
    to: "on"
    id: force_on
    enabled: !input enable_force_override
  - trigger: state
    entity_id: !input force_heating_boolean
    to: "off"
    id: force_off
    enabled: !input enable_force_override
  - trigger: state
    entity_id: !input heater_mode_select
    to: READY_REST
    id: watchdog
    enabled: !input enable_watchdog
  - trigger: time_pattern
    minutes: !input assert_interval
    id: assert
    enabled: !input enable_periodic_assert
conditions:
  - condition: state
    entity_id: !input online_sensor
    state: "on"
actions:
  - variables:
      expected: >-
        {% if is_state(force_heating_boolean, 'on') -%}
        READY
        {%- elif is_state(cheap_hour_sensor, 'on') -%}
        READY
        {%- else -%}
        REST
        {%- endif %}
      current: "{{ states(heater_mode_select) }}"
  - choose:
      # Cheap hour started: go READY
      - conditions:
          - condition: trigger
            id: cheap_on
        sequence:
          - action: select.select_option
            target:
              entity_id: !input heater_mode_select
            data:
              option: READY

      # Cheap hour ended: go REST unless force is on
      - conditions:
          - condition: trigger
            id: cheap_off
          - condition: state
            entity_id: !input force_heating_boolean
            state: "off"
        sequence:
          - action: select.select_option
            target:
              entity_id: !input heater_mode_select
            data:
              option: REST

      # Force heating turned on: always READY
      - conditions:
          - condition: trigger
            id: force_on
        sequence:
          - action: select.select_option
            target:
              entity_id: !input heater_mode_select
            data:
              option: READY

      # Force heating turned off: re-evaluate based on price
      - conditions:
          - condition: trigger
            id: force_off
        sequence:
          - action: select.select_option
            target:
              entity_id: !input heater_mode_select
            data:
              option: "{{ expected }}"

      # Watchdog: unexpected READY_REST detected, correct and optionally notify
      - conditions:
          - condition: trigger
            id: watchdog
        sequence:
          - action: select.select_option
            target:
              entity_id: !input heater_mode_select
            data:
              option: "{{ expected }}"
          - if:
              - condition: template
                value_template: "{{ notify_on_watchdog and notify_service | length > 0 }}"
            then:
              - action: "{{ notify_service }}"
                data:
                  title: "{{ notify_title }}"
                  message: "{{ watchdog_message | replace('{expected}', expected) }}"

      # Periodic assertion: correct drift and optionally notify
      - conditions:
          - condition: trigger
            id: assert
          - condition: template
            value_template: "{{ current != expected }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: !input heater_mode_select
            data:
              option: "{{ expected }}"
          - if:
              - condition: template
                value_template: "{{ notify_on_assert_correction and notify_service | length > 0 }}"
            then:
              - action: "{{ notify_service }}"
                data:
                  title: "{{ notify_title }}"
                  message: >-
                    {{ assert_message
                       | replace('{current}', current)
                       | replace('{expected}', expected) }}
mode: queued
max: 3
